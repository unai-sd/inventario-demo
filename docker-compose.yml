# PostgreSQL for local development and integration tests.
# Credentials are local-only demo values; see .env.example.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
      POSTGRES_DB: inventario
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
